spring.application.name=baozi-store
server.port=8081

# ======================================================
# OPÇÃO 1 (PADRÃO): Banco H2 em arquivo - zero instalação
# Os dados ficam salvos na pasta ./data
# Console web do banco: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/baozidb  | user: sa | senha: (vazia)
# ======================================================
spring.datasource.url=jdbc:h2:file:./data/baozidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ======================================================
# OPÇÃO 2: MySQL  (comente a OPÇÃO 1 e descomente este bloco)
# Antes, crie o banco:  CREATE DATABASE baozistore;
# ======================================================
#spring.datasource.url=jdbc:mysql://localhost:3306/baozistore?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=SUA_SENHA
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
